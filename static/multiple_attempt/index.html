<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Canvas Quiz Attempts</title>
    <link rel="SHORTCUT ICON" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid pl-3 pr-3">
            <a class="navbar-brand" href="#">Convert Canvas Quiz Attempts</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse d-print-none" id="navbarSupportedContent">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://projectassessment.app/" target="_blank" rel="noopener noreferrer">Project Based Assessment</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/convert/" target="_blank" rel="noopener noreferrer">Convert Canvas Rubrics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://docs.projectassessment.app/" target="_blank" rel="noopener noreferrer">Docs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <div id="notifications" class="container mt-3"></div>
        <div class="container-fluid mt-3">
            <div class="container" id="fileInputDiv">
                <form>
                    <label for="csvFileInput" class="form-label">Select a Canvas New Quizzes CSV export to convert</label>
                    <input type="file" class="form-control" id="csvFileInput" accept=".csv">
                </form>
            </div>
            <div class="container" id="matchingDialog"></div>
        </div>
    </main>

    <template id="nameMatchingTemplate">
        <h5>Set names for each rubric rows</h5>
        <div class="p-3 bg-info bg-opacity-10 border-top border-bottom border-info mt-3 mb-3">
            The following item IDs were detected in the uploaded file. Enter a rubric row name for each one, or leave the default value to keep the original ID.
        </div>
        <form id="nameMatchingForm"></form>
    </template>

    <template id="errorDialogTemplate">
        <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Oops! Something is wrong!</h4>
            <p class="errorDialogMessage mb-0"></p>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js" integrity="sha384-Jd2/X5FXVKahwaY2nivvw4LfSTg9idSj8yNXWtT4qef0fHSYr6M7M8bJAfbFYoMc" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
